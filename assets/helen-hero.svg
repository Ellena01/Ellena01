<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroT heroD">
  <title id="heroT">Helen Oyiza — Computer Science student at AUST, Abuja</title>
  <desc id="heroD">Burgundy editorial hero banner: name, professional headline, focus areas and a geometric motif of concentric rings and connected nodes.</desc>

  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#180A12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>

    <radialGradient id="hGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 96) scale(360 240)">
      <stop stop-color="#FF2A85" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hRule" x1="72" y1="106" x2="330" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#701A3D"/>
      <stop offset="0.6" stop-color="#B34A76"/>
      <stop offset="1" stop-color="#FF2A85"/>
    </linearGradient>

    <linearGradient id="hAccent" x1="48" y1="88" x2="48" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A85"/>
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hBase" x1="72" y1="372" x2="1128" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B34A76" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0.25"/>
    </linearGradient>

    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#hBg)"/>
  <rect width="1200" height="400" fill="url(#hGrid)"/>
  <rect width="1200" height="400" fill="url(#hGlow)"/>

  <!-- motif: concentric rings -->
  <g fill="none" stroke="#E5B5C7">
    <circle cx="990" cy="200" r="78" stroke="#701A3D" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="990" cy="200" r="104" stroke="#8E2E52" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="990" cy="200" r="130" stroke="#B34A76" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="990" cy="200" r="156" stroke="#E5B5C7" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="990" cy="200" r="182" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
  </g>

  <!-- motif: connected nodes -->
  <g stroke="#B34A76" stroke-opacity="0.6" stroke-width="1">
    <path d="M905 232 L958 176 L1030 158 L1092 196 L1058 262 L974 274 L905 232 Z" fill="none"/>
    <path d="M958 176 L974 274 M1030 158 L1058 262" fill="none"/>
  </g>
  <g>
    <circle cx="905" cy="232" r="4" fill="#E5B5C7" fill-opacity="0.85"/>
    <circle cx="958" cy="176" r="4.5" fill="#FF2A85"/>
    <circle cx="1030" cy="158" r="4" fill="#E5B5C7" fill-opacity="0.85"/>
    <circle cx="1092" cy="196" r="4" fill="#E5B5C7" fill-opacity="0.85"/>
    <circle cx="1058" cy="262" r="4" fill="#E5B5C7" fill-opacity="0.85"/>
    <circle cx="974" cy="274" r="4.5" fill="#FF2A85"/>
  </g>

  <!-- motif: signal ticks -->
  <g stroke="#701A3D" stroke-width="1.4">
    <line x1="1150" y1="120" x2="1150" y2="152" stroke-opacity="0.5"/>
    <line x1="1158" y1="104" x2="1158" y2="152" stroke-opacity="0.35"/>
    <line x1="1166" y1="132" x2="1166" y2="152" stroke-opacity="0.25"/>
  </g>

  <!-- vertical accent -->
  <rect x="46" y="88" width="3" height="202" rx="1.5" fill="url(#hAccent)"/>

  <!-- eyebrow -->
  <text x="72" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="6" fill="#C77B9B">GITHUB PROFILE · 2026</text>
  <line x1="72" y1="106" x2="330" y2="106" stroke="url(#hRule)" stroke-width="2.5"/>

  <!-- name -->
  <text x="72" y="176" font-family="Georgia, 'Times New Roman', Times, serif" font-size="64" font-weight="700" fill="#F8F0F3">Helen Oyiza</text>
  <circle cx="470" cy="158" r="5" fill="#FF2A85"/>

  <!-- headline -->
  <text x="72" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#E5B5C7">Engineering that holds up —</text>
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#E5B5C7">from the model to the last pixel.</text>

  <!-- role line -->
  <text x="72" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="0.6" fill="#C9D1D9" fill-opacity="0.92">Computer Science · AUST, Abuja · AI applications · full-stack systems · product design</text>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.4" fill="#C77B9B">
    <rect x="72" y="312" width="163" height="24" rx="12" fill="#2A0F1C" stroke="#701A3D"/>
    <text x="86" y="328">300L · CS UNDERGRAD</text>

    <rect x="247" y="312" width="211" height="24" rx="12" fill="#2A0F1C" stroke="#701A3D"/>
    <text x="261" y="328">AI · FULL-STACK · DESIGN</text>

    <rect x="470" y="312" width="165" height="24" rx="12" fill="#2A0F1C" stroke="#701A3D"/>
    <text x="484" y="328">OPEN TO INTERNSHIPS</text>
  </g>

  <!-- base hairline -->
  <line x1="72" y1="372" x2="1128" y2="372" stroke="url(#hBase)" stroke-width="1.6"/>
</svg>
