<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-labelledby="footT footD">
  <title id="footT">Closing mark</title>
  <desc id="footD">Burgundy closing rule with the line “Still becoming. Already building.” and Helen Oyiza’s name, field and location.</desc>
  <defs>
    <linearGradient id="fLine" x1="80" y1="30" x2="820" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2A85" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="80" y1="30" x2="820" y2="30" stroke="url(#fLine)" stroke-width="1.6"/>
  <rect x="447" y="27" width="6" height="6" rx="1" fill="#FF2A85" transform="rotate(45 450 30)"/>
  <text x="450" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" font-style="italic" fill="#E5B5C7">Still becoming. Already building.</text>
  <text x="450" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="4" fill="#8C6B79">HELEN OYIZA · COMPUTER SCIENCE · AUST, ABUJA</text>
